name: Upstream sync and automatic test release

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Rebuild even if upstream has not changed
        type: boolean
        default: true
  schedule:
    - cron: '21 */6 * * *'
  push:
    paths:
      - '.github/workflows/upstream-sync-release.yml'

permissions:
  contents: read

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/25
          fetch-depth: 0
      - name: Merge new upstream commits without deleting local workflows
        id: check
        env:
          UPSTREAM_REPO: hurui200320/nsg
          UPSTREAM_BRANCH: feat/25
          TARGET_BRANCH: feat/25
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          upstream_sha="$(git rev-parse "refs/remotes/upstream/$UPSTREAM_BRANCH")"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already synchronized."
          else
            git merge --no-edit -m "chore: sync upstream $upstream_sha" "$upstream_sha"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/25
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build installable GPS Android test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build ESP32 release firmware
        run: |
          python -m pip install platformio==6.1.19
          cd esp32
          pio test -e native
          pio run -e esp32-wroom-32e-release
      - name: Collect APK and ESP32 firmware
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/nsg-android-test.apk
          cp esp32/.pio/build/esp32-wroom-32e-release/firmware.bin dist/nsg-esp32-wroom-32e-firmware.bin
          (cd dist && sha256sum *.apk *.bin > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  release:
    needs: [sync, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Derive unique upstream release tag
        id: meta
        env:
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
        run: |
          short_sha="$(printf '%s' "$UPSTREAM_SHA" | cut -c1-12)"
          echo "tag=upstream-$short_sha" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: feat/25
          name: "Nikon Smart GPS automated build ${{ steps.meta.outputs.tag }}"
          prerelease: true
          generate_release_notes: false
          body: |
            Automatically synchronized from https://github.com/hurui200320/nsg (branch feat/25).
            Upstream commit: ${{ needs.sync.outputs.upstream_sha }}.
            Unofficial test build. Android packages are signed with a temporary debug/test key, not the original publisher's release key; upgrading may require uninstalling the previous copy.
          files: dist/*
          fail_on_unmatched_files: true
